services:

  # ─── PgBouncer (커넥션 풀 프록시) ─────────────────────────────────────────
  #
  # WHY: PostgreSQL은 프로세스-per-connection 모델이라 커넥션 수가 늘수록
  #      컨텍스트 스위칭 오버헤드가 급증한다. 850대 에이전트 환경에서
  #      Spring Boot Hikari(70개) → PgBouncer(25개) → PostgreSQL 구조로
  #      실제 PG 커넥션 수를 최소화해 처리량을 2~3배 향상시킨다.
  #
  # pool_mode=transaction: 쿼리 실행 동안만 PG 커넥션 점유
  #   → 논리 커넥션 70개를 실제 PG 커넥션 25개로 다중화
  #   → Hibernate의 서버사이드 prepared statement와 충돌하므로
  #     Spring Boot 측에서 prepareThreshold=0 설정 필요 (application.yml 참조)
  pgbouncer:
    image: edoburu/pgbouncer:1.21.0
    restart: unless-stopped
    env_file: .env
    environment:
      DB_USER: ${POSTGRES_USER:-dashboard}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-dashboard}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-dashboard_db}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "300"
      DEFAULT_POOL_SIZE: "25"
      MIN_POOL_SIZE: "5"
      RESERVE_POOL_SIZE: "5"
      SERVER_RESET_QUERY: "DISCARD ALL"
      AUTH_TYPE: md5
      LOG_CONNECTIONS: "0"
      LOG_DISCONNECTIONS: "0"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dashboard

  # ─── PostgreSQL ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dashboard_db}
      POSTGRES_USER: ${POSTGRES_USER:-dashboard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dashboard}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - dashboard

  # ─── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    env_file: .env
    command: >
      sh -c '
      if [ -n "$$REDIS_PASSWORD" ]; then
        redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD";
      else
        redis-server --appendonly yes;
      fi'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$${REDIS_PASSWORD}\" ]; then redis-cli -a \"$${REDIS_PASSWORD}\" ping; else redis-cli ping; fi"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - dashboard

  # ─── Spring Boot 백엔드 ────────────────────────────────────────────────────
  backend:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-8888}:8888"
    environment:
      SERVER_PORT: 8888
      SERVER_HOST: ${SERVER_HOST:-0.0.0.0}
      DB_URL: ${DB_URL:-jdbc:postgresql://pgbouncer:5432/${POSTGRES_DB:-dashboard_db}}
      DB_DRIVER: ${DB_DRIVER:-org.postgresql.Driver}
      DB_USERNAME: ${POSTGRES_USER:-dashboard}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-dashboard}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-validate}
      FLYWAY_ENABLED: ${FLYWAY_ENABLED:-true}
      FLYWAY_LOCATIONS: ${FLYWAY_LOCATIONS:-classpath:db/pgmigration}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      SERVER_FORWARD_HEADERS_STRATEGY: NATIVE
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - dashboard

  # ─── Nginx 리버스 프록시 ────────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    depends_on:
      - backend
    networks:
      - dashboard

networks:
  dashboard:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
