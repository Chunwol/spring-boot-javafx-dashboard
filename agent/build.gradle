plugins {
    id 'java'
    id 'application'
    // GraalVM Native Image를 사용하려면 아래 플러그인을 활성화하고
    // GraalVM JDK로 빌드해야 함 (일반 JDK에서는 주석 처리)
    // id 'org.graalvm.buildtools.native' version '0.9.28'
}

group = 'com.example'
version = '1.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

repositories {
    mavenCentral()
}

dependencies {
    // 하드웨어 정보 수집 (MAC, IP, 네트워크 트래픽)
    implementation 'com.github.oshi:oshi-core:6.4.13'

    // HTTP 클라이언트
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // JSON 직렬화
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.1'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.17.1'

    // 로깅
    implementation 'org.slf4j:slf4j-simple:2.0.13'

    // 테스트
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation 'org.assertj:assertj-core:3.25.3'
    testImplementation 'org.mockito:mockito-core:5.11.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.11.0'
}

test {
    useJUnitPlatform()
}

application {
    mainClass = 'com.example.agent.AgentMain'
    applicationDefaultJvmArgs = ["-Dpcagent.config.dir=${rootDir}/scripts"]
}

compileJava {
    options.encoding = 'UTF-8'
}

compileTestJava {
    options.encoding = 'UTF-8'
}

jar {
    archiveBaseName = 'agent'
    archiveVersion = '1.0.0'
    manifest {
        attributes 'Main-Class': 'com.example.agent.AgentMain'
    }
    // 의존성 포함 fat jar
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// ═══════════════════════════════════════════════════════════════════════
// 배포 패키지 자동화 (Zip)
// 용법: gradlew :agent:deployPackage
// 출력: dist/agent-${version}-deploy.zip
// ═══════════════════════════════════════════════════════════════════════
task deployPackage(type: Zip) {
    group = 'distribution'
    description = 'Create deployment package with JAR, config, and scripts'

    // JAR 파일 포함
    from("${project.buildDir}/libs") {
        include 'agent-*.jar'
        into 'agent-package'
    }

    // 설정 및 배포 스크립트 포함
    from("${rootDir}/scripts") {
        include 'config.json'
        include 'install.bat'
        include 'uninstall.bat'
        include 'agent-watchdog.ps1'
        into 'agent-package'
    }

    // 설치 가이드 포함 (문서)
    from("${rootDir}/docs") {
        include 'AGENT_INSTALL_GUIDE.md'
        into 'agent-package/docs'
    }

    archiveFileName = "agent-${project.version}-deploy.zip"
    destinationDirectory = file("${rootDir}/dist")
}

// deployPackage는 JAR 빌드 완료 후 실행
deployPackage.dependsOn(jar)

// ═══════════════════════════════════════════════════════════════════════
// Dockerfile 및 Docker Compose 이미지 빌드 (선택사항)
// ═══════════════════════════════════════════════════════════════════════
task buildDockerImage {
    group = 'docker'
    description = 'Build Docker image for agent'
    doLast {
        exec {
            commandLine 'docker', 'build', '-t', 'pcagent:1.0.0', '-f', 'Dockerfile', '.'
        }
    }
}

