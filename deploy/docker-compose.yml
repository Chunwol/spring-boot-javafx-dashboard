services:

  # ─── PostgreSQL ──────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dashboard_db}
      POSTGRES_USER: ${POSTGRES_USER:-dashboard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - dashboard

  # ─── Redis ───────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command: >
      sh -c '
      if [ -n "$$REDIS_PASSWORD" ]; then
        redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD";
      else
        redis-server --appendonly yes;
      fi'
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$${REDIS_PASSWORD}\" ]; then redis-cli -a \"$${REDIS_PASSWORD}\" ping; else redis-cli ping; fi"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - dashboard

  # ─── Spring Boot 백엔드 ──────────────────────────────
  # HTTPS는 시놀로지 DSM 역방향 프록시가 처리
  # 제어판 → 로그인 포털 → 역방향 프록시 → localhost:8888 로 포워딩
  app:
    image: classroom-dashboard:latest
    restart: unless-stopped
    env_file: .env
    ports:
      - "8888:8888"
    environment:
      SERVER_PORT: 8888
      SERVER_FORWARD_HEADERS_STRATEGY: NATIVE
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-dashboard_db}
      DB_DRIVER: org.postgresql.Driver
      DB_USERNAME: ${POSTGRES_USER:-dashboard}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      FLYWAY_LOCATIONS: classpath:db/pgmigration
    volumes:
      - ./data/uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8888/actuator/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    networks:
      - dashboard

networks:
  dashboard:
    driver: bridge
