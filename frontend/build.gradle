plugins {
    id 'java'
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
    id 'com.gradleup.shadow' version '9.4.1'
}

import org.gradle.internal.os.OperatingSystem
import org.gradle.api.attributes.Category
import org.gradle.api.attributes.LibraryElements
import org.gradle.api.attributes.Usage
import org.gradle.nativeplatform.MachineArchitecture
import org.gradle.nativeplatform.OperatingSystemFamily

group = 'com.example'
version = '0.0.1-SNAPSHOT'
def nativeAccessJavaExecArgs = ['--enable-native-access=javafx.graphics']
def nativeAccessTestArgs = ['--enable-native-access=ALL-UNNAMED']
def currentOs = OperatingSystem.current()
def currentArch = (System.getProperty('os.arch') ?: '').toLowerCase(Locale.ROOT)

java {
    sourceCompatibility = '25'
}

repositories {
    mavenCentral()
}

javafx {
    version = "25.0.2"
    modules = [ 'javafx.controls', 'javafx.fxml', 'javafx.web', 'javafx.swing', 'javafx.graphics' ]
}

application {
    mainClass = 'com.example.frontend.DashboardApp'
    applicationDefaultJvmArgs = nativeAccessJavaExecArgs
}

compileJava {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xlint:deprecation', '-Xlint:unchecked']
}

// ── 플랫폼별 JavaFX 네이티브 Gradle 설정 ─────────────────────────────────
// mac과 mac-aarch64는 같은 native/darwin/ 경로를 사용해 충돌 발생.
// DuplicatesStrategy.EXCLUDE 단순 순서 변경으로는 해결 불가.
// 해결책: 플랫폼별 독립 Gradle 설정(configuration) + 각각 shadow JAR 빌드.
configurations {
    jfxWin          // Windows x64
    jfxMacIntel     // macOS x86_64
    jfxMacArm64     // macOS Apple Silicon (aarch64)
    jfxLinux        // Linux x64
}

def jfxVersion = '25.0.2'
def jfxModules = ['javafx-base', 'javafx-graphics', 'javafx-controls',
                  'javafx-fxml', 'javafx-media', 'javafx-web', 'javafx-swing']
def platformJarSpecs = [
    [task: 'shadowJarWin',      clf: 'win',         cfg: 'jfxWin',      fileName: 'frontend-win.jar'],
    [task: 'shadowJarMacIntel', clf: 'mac',         cfg: 'jfxMacIntel', fileName: 'frontend-mac.jar'],
    [task: 'shadowJarMacArm64', clf: 'mac-aarch64', cfg: 'jfxMacArm64', fileName: 'frontend-mac-aarch64.jar'],
    [task: 'shadowJarLinux',    clf: 'linux',       cfg: 'jfxLinux',    fileName: 'frontend-linux.jar'],
]

[jfxWin: [os: 'windows', arch: 'x86-64'],
 jfxMacIntel: [os: 'macos', arch: 'x86-64'],
 jfxMacArm64: [os: 'macos', arch: 'aarch64'],
 jfxLinux: [os: 'linux', arch: 'x86-64']].each { cfg, attrs ->
    configurations.named(cfg) {
        attributes {
            attribute(Usage.USAGE_ATTRIBUTE, objects.named(Usage, Usage.JAVA_RUNTIME))
            attribute(Category.CATEGORY_ATTRIBUTE, objects.named(Category, Category.LIBRARY))
            attribute(LibraryElements.LIBRARY_ELEMENTS_ATTRIBUTE, objects.named(LibraryElements, LibraryElements.JAR))
            attribute(OperatingSystemFamily.OPERATING_SYSTEM_ATTRIBUTE, objects.named(OperatingSystemFamily, attrs.os))
            attribute(MachineArchitecture.ARCHITECTURE_ATTRIBUTE, objects.named(MachineArchitecture, attrs.arch))
        }
    }
}

[jfxWin: 'win', jfxMacIntel: 'mac', jfxMacArm64: 'mac-aarch64', jfxLinux: 'linux'].each { cfg, clf ->
    jfxModules.each { mod ->
        dependencies.add(cfg, "org.openjfx:${mod}:${jfxVersion}:${clf}")
    }
}

dependencies {
    // IDE / ./gradlew run 용: 현재 빌드 OS 네이티브는 openjfx 플러그인이 자동 포함.
    // 개발 편의를 위해 모든 플랫폼 추가 (runtimeOnly = 런타임 클래스패스에만 포함)
    for (def clf in ['win', 'mac', 'mac-aarch64', 'linux']) {
        jfxModules.each { mod ->
            runtimeOnly "org.openjfx:${mod}:${jfxVersion}:${clf}"
        }
    }

    implementation project(':common')
    implementation 'org.controlsfx:controlsfx:11.1.2'
    implementation 'org.kordamp.ikonli:ikonli-javafx:12.3.1'
    implementation 'org.kordamp.ikonli:ikonli-materialdesign2-pack:12.3.1'
    implementation 'io.github.mkpaz:atlantafx-base:2.0.1'
    
    // Jackson for JSON
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.15.2'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.15.2'
    
    // WebSocket / Stomp Client
    implementation 'org.springframework:spring-messaging:6.1.4'
    implementation 'org.springframework:spring-websocket:6.1.4'
    implementation 'org.glassfish.tyrus.bundles:tyrus-standalone-client:2.1.1'
    // Jakarta WebSocket API (for ClientEndpointConfig)
    implementation 'jakarta.websocket:jakarta.websocket-client-api:2.1.1'
    
    // Logging
    implementation 'org.slf4j:slf4j-api:2.0.7'
    implementation 'ch.qos.logback:logback-classic:1.4.11'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.assertj:assertj-core:3.25.3'
    testImplementation 'org.hamcrest:hamcrest:2.2'
    testImplementation 'org.testfx:testfx-junit5:4.0.18'
}

test {
    useJUnitPlatform()
    exclude '**/*UiSmokeTest.class'
}

tasks.withType(JavaExec).configureEach {
    jvmArgs(nativeAccessJavaExecArgs)
}

tasks.withType(Test).configureEach {
    jvmArgs(nativeAccessTestArgs)
    systemProperty 'java.awt.headless', 'false'
}

tasks.register('unitTest', Test) {
    description = 'Runs frontend unit tests (excluding JavaFX UI smoke tests).'
    group = 'verification'
    useJUnitPlatform()
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    exclude '**/*UiSmokeTest.class'
}

tasks.register('uiSmokeTest', Test) {
    description = 'Runs JavaFX TestFX smoke tests.'
    group = 'verification'
    useJUnitPlatform()
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    include '**/*UiSmokeTest.class'

    // CI/Linux 환경에서 안정적인 JavaFX 렌더링 옵션
    systemProperty 'testfx.robot', 'glass'
    systemProperty 'java.awt.headless', 'false'
    systemProperty 'prism.order', 'sw'
    systemProperty 'prism.text', 't2k'

    shouldRunAfter tasks.named('unitTest')
}

// ── 공통 shadow JAR 설정 헬퍼 ────────────────────────────────────────────
def configureShadowJar(task, classifier) {
    task.configure {
        group = 'distribution'
        archiveBaseName = 'frontend'
        archiveVersion = project.version
        archiveClassifier = classifier
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
        mergeServiceFiles()
        manifest {
            attributes(
                'Main-Class': 'com.example.frontend.Launcher',
                'Implementation-Title': project.name,
                'Implementation-Version': project.version
            )
        }
    }
}

// ── 기본 shadow JAR (현재 빌드 OS 기준, IDE/개발용) ─────────────────────
shadowJar {
    // runtimeClasspath에 모든 플랫폼 포함 → ./gradlew run 으로 사용
    // 배포용은 아래 플랫폼별 태스크 사용
    archiveBaseName = 'frontend'
    archiveVersion = project.version
    archiveClassifier = 'all'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    mergeServiceFiles()
    manifest {
        attributes(
            'Main-Class': 'com.example.frontend.Launcher',
            'Implementation-Title': project.name,
            'Implementation-Version': project.version
        )
    }
}

// ── 플랫폼별 배포 JAR ───────────────────────────────────────────────────
// 각 JAR은 해당 플랫폼 네이티브만 포함 → native/darwin/ 경로 충돌 없음
// 배포 시 OS에 맞는 JAR을 선택해 java -jar 로 실행:
//   Windows      → frontend-win.jar
//   macOS Intel  → frontend-mac.jar
//   macOS ARM64  → frontend-mac-aarch64.jar
//   Linux        → frontend-linux.jar

// runtimeClasspath에서 org.openjfx 제외한 기본 설정 (각 플랫폼 태스크가 공유)
// (copyRecursive 클로저 안의 exclude는 ShadowJar.exclude로 오해석되어 외부 선언)
def baseRuntimeNoJfx = configurations.runtimeClasspath.copyRecursive()
baseRuntimeNoJfx.exclude(group: 'org.openjfx')

platformJarSpecs.each { p ->
    tasks.register(p.task, com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar) {
        description = "Platform fat JAR for ${p.clf} (java -jar 로 즉시 실행 가능)"
        dependsOn jar, project(':common').tasks.named('classes')

        from sourceSets.main.output
        from project(':common').sourceSets.main.output

        // JFX 제외된 공통 의존성 + 이 플랫폼 전용 JFX 네이티브
        configurations = [baseRuntimeNoJfx]
        from(project.configurations[p.cfg].resolvedConfiguration
                .resolvedArtifacts.collect { zipTree(it.file) })

        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
        mergeServiceFiles()
        archiveBaseName = 'frontend'
        archiveVersion = project.version
        archiveClassifier = p.clf
        manifest {
            attributes(
                'Main-Class': 'com.example.frontend.Launcher',
                'Implementation-Title': project.name,
                'Implementation-Version': project.version
            )
        }
    }
}

// ── 전체 플랫폼 한 번에 빌드 ─────────────────────────────────────────────
tasks.register('shadowJarAll') {
    group = 'distribution'
    description = '모든 플랫폼 fat JAR 한 번에 빌드 (win / mac / mac-aarch64 / linux)'
    dependsOn 'shadowJarWin', 'shadowJarMacIntel', 'shadowJarMacArm64', 'shadowJarLinux'
}

def currentPlatformSpec = {
    if (currentOs.isWindows()) {
        return platformJarSpecs.find { it.task == 'shadowJarWin' }
    }
    if (currentOs.isMacOsX()) {
        return currentArch.contains('aarch64') || currentArch.contains('arm64')
            ? platformJarSpecs.find { it.task == 'shadowJarMacArm64' }
            : platformJarSpecs.find { it.task == 'shadowJarMacIntel' }
    }
    if (currentOs.isLinux()) {
        return platformJarSpecs.find { it.task == 'shadowJarLinux' }
    }
    throw new GradleException("Unsupported OS for frontend platform jar: ${System.getProperty('os.name')} (${currentArch})")
}()

tasks.register('publishCurrentPlatformJar', Sync) {
    group = 'distribution'
    description = "현재 OS/아키텍처용 실행 JAR 생성 → dist/frontend/${currentPlatformSpec.fileName}"
    dependsOn currentPlatformSpec.task
    into file("${rootDir}/dist/frontend")
    from(tasks.named(currentPlatformSpec.task)) {
        rename { currentPlatformSpec.fileName }
    }
}

tasks.register('publishPlatformJars', Sync) {
    group = 'distribution'
    description = '모든 플랫폼 실행 JAR 생성 → dist/frontend/frontend-{win|mac|mac-aarch64|linux}.jar'
    dependsOn platformJarSpecs.collect { it.task }
    into file("${rootDir}/dist/frontend")
    platformJarSpecs.each { spec ->
        from(tasks.named(spec.task)) {
            rename { spec.fileName }
        }
    }
}

// ════════════════════════════════════════════════════════════════════
//  네이티브 패키징 (jpackage)
//  - jpackage 는 타겟 OS 에서만 빌드 가능 (Win→.exe, mac→.app/.dmg)
//  - app-image: 자체 JRE 내장 폴더 (Java 설치 불필요, 무설치 포터블)
//  - 공통 입력 스테이징: shadowJar 1개만 깨끗한 디렉터리에 복사
// ════════════════════════════════════════════════════════════════════

def appName = 'ClassroomDashboard'
def pkgVendor = 'Dongyang'
def pkgDesc = 'Integrated Classroom Dashboard'

// jpackage --input 에 넘길 스테이징 디렉터리: shadowJar 만 포함
tasks.register('stagePackageInput', Copy) {
    dependsOn shadowJar
    from shadowJar.archiveFile
    into layout.buildDirectory.dir('package-input')
    doFirst { delete(layout.buildDirectory.dir('package-input')) }
}

// ── ① Windows 포터블 (app-image 폴더) ───────────────────────────────
tasks.register('packagePortable', Exec) {
    group = 'distribution'
    description = 'Windows 무설치 포터블 (exe+JRE 폴더). build/package/ClassroomDashboard/'
    dependsOn stagePackageInput
    onlyIf { OperatingSystem.current().isWindows() }
    doFirst {
        def outDir = file("${layout.buildDirectory.get()}/package")
        delete("${outDir}/${appName}")
        outDir.mkdirs()
        commandLine 'jpackage',
            '--type', 'app-image',
            '--name', appName,
            '--input', file("${layout.buildDirectory.get()}/package-input").absolutePath,
            '--main-jar', shadowJar.archiveFileName.get(),
            '--main-class', application.mainClass.get(),
            '--java-options', '--enable-native-access=javafx.graphics',
            '--dest', outDir.absolutePath,
            '--vendor', pkgVendor,
            '--description', pkgDesc
    }
}

// ── ② Windows 포터블 zip (실배포 권장: 파일 1개로 전달) ─────────────
tasks.register('packagePortableZip', Zip) {
    group = 'distribution'
    description = '포터블 폴더를 zip 1개로 압축. build/dist/ClassroomDashboard-win-portable.zip'
    dependsOn 'packagePortable'
    onlyIf { OperatingSystem.current().isWindows() }
    from layout.buildDirectory.dir("package/${appName}")
    into appName
    archiveFileName = "${appName}-win-portable.zip"
    destinationDirectory = layout.buildDirectory.dir('dist')
}

// ── ③ Windows 진짜 단일 .exe (Warp 자체압축 래퍼) ───────────────────
//  warp-packer 바이너리가 PATH 또는 -Pwarp=경로 로 있어야 함.
//  https://github.com/dgiagio/warp/releases  (warp-packer-windows-x64.exe)
//  없으면 자동 skip + 안내 출력.
tasks.register('packageSingleExe', Exec) {
    group = 'distribution'
    description = '단일 포터블 .exe (Warp). build/dist/ClassroomDashboard.exe'
    dependsOn 'packagePortable'
    onlyIf {
        if (!OperatingSystem.current().isWindows()) return false
        def warp = (project.findProperty('warp') ?: 'warp-packer').toString()
        def found = (project.findProperty('warp') ? file(warp).exists()
                     : (System.getenv('PATH') ?: '').split(File.pathSeparator)
                         .any { new File(it, 'warp-packer.exe').exists() || new File(it, 'warp-packer').exists() })
        if (!found) {
            logger.warn("⚠ warp-packer 없음 → packageSingleExe 건너뜀. " +
                "https://github.com/dgiagio/warp/releases 에서 받아 PATH 에 두거나 " +
                "-Pwarp=C:\\\\path\\\\warp-packer.exe 로 지정하세요. " +
                "(단일 exe 불필요 시 packagePortableZip 사용)")
        }
        return found
    }
    doFirst {
        def warp = (project.findProperty('warp') ?: 'warp-packer').toString()
        def distDir = file("${layout.buildDirectory.get()}/dist")
        distDir.mkdirs()
        commandLine warp,
            '--arch', 'windows-x64',
            '--input_dir', file("${layout.buildDirectory.get()}/package/${appName}").absolutePath,
            '--exec', "${appName}.exe",
            '--output', new File(distDir, "${appName}.exe").absolutePath
    }
}

// ── Windows 설치형 (.msi / .exe 인스톨러) — 필요 시 ─────────────────
tasks.register('packageMsi', Exec) {
    group = 'distribution'
    description = 'Windows MSI 인스톨러 (설치형, 바로가기 생성)'
    dependsOn stagePackageInput
    onlyIf { OperatingSystem.current().isWindows() }
    doFirst {
        def outDir = file("${layout.buildDirectory.get()}/package")
        outDir.mkdirs()
        commandLine 'jpackage',
            '--type', 'msi',
            '--name', appName,
            '--input', file("${layout.buildDirectory.get()}/package-input").absolutePath,
            '--main-jar', shadowJar.archiveFileName.get(),
            '--main-class', application.mainClass.get(),
            '--java-options', '--enable-native-access=javafx.graphics',
            '--dest', outDir.absolutePath,
            '--vendor', pkgVendor,
            '--description', pkgDesc,
            '--win-dir-chooser', '--win-menu', '--win-shortcut'
    }
}

// ── macOS (.app 폴더 / .dmg) — Mac 에서만 실행됨, 지금은 설정만 ─────
tasks.register('packageMacApp', Exec) {
    group = 'distribution'
    description = 'macOS .app 번들 (무설치). Mac 에서만 빌드 가능'
    dependsOn stagePackageInput
    onlyIf { OperatingSystem.current().isMacOsX() }
    doFirst {
        def outDir = file("${layout.buildDirectory.get()}/package")
        delete("${outDir}/${appName}.app")
        outDir.mkdirs()
        commandLine 'jpackage',
            '--type', 'app-image',
            '--name', appName,
            '--input', file("${layout.buildDirectory.get()}/package-input").absolutePath,
            '--main-jar', shadowJar.archiveFileName.get(),
            '--main-class', application.mainClass.get(),
            '--java-options', '--enable-native-access=javafx.graphics',
            '--dest', outDir.absolutePath,
            '--vendor', pkgVendor,
            '--description', pkgDesc
    }
}

tasks.register('packageMacDmg', Exec) {
    group = 'distribution'
    description = 'macOS .dmg (더블클릭→Applications 드래그). Mac 에서만 빌드 가능'
    dependsOn stagePackageInput
    onlyIf { OperatingSystem.current().isMacOsX() }
    doFirst {
        def outDir = file("${layout.buildDirectory.get()}/package")
        outDir.mkdirs()
        commandLine 'jpackage',
            '--type', 'dmg',
            '--name', appName,
            '--input', file("${layout.buildDirectory.get()}/package-input").absolutePath,
            '--main-jar', shadowJar.archiveFileName.get(),
            '--main-class', application.mainClass.get(),
            '--java-options', '--enable-native-access=javafx.graphics',
            '--dest', outDir.absolutePath,
            '--vendor', pkgVendor,
            '--description', pkgDesc
    }
}

// 편의 집계 태스크
tasks.register('packageWindows') {
    group = 'distribution'
    description = 'Windows 포터블 zip + 단일 exe(가능 시) 일괄'
    dependsOn 'packagePortableZip', 'packageSingleExe'
}
tasks.register('packageMac') {
    group = 'distribution'
    description = 'macOS .app + .dmg 일괄 (Mac 에서만)'
    dependsOn 'packageMacApp', 'packageMacDmg'
}

jar.dependsOn shadowJar
assemble.dependsOn publishPlatformJars
build.dependsOn shadowJar, publishPlatformJars
