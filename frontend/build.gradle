plugins {
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
    id 'com.github.johnrengelman.shadow' version '7.1.2'
}

import org.gradle.internal.os.OperatingSystem

group = 'com.example'
version = '0.0.1-SNAPSHOT'

repositories {
    mavenCentral()
}

javafx {
    version = "17.0.6"
    modules = [ 'javafx.controls', 'javafx.fxml', 'javafx.web', 'javafx.swing', 'javafx.graphics' ]
}

application {
    mainClass = 'com.example.frontend.DashboardApp'
}

compileJava {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xlint:deprecation', '-Xlint:unchecked']
}

dependencies {
    implementation project(':common')
    implementation 'org.controlsfx:controlsfx:11.1.2'
    implementation 'org.kordamp.ikonli:ikonli-javafx:12.3.1'
    implementation 'org.kordamp.ikonli:ikonli-materialdesign2-pack:12.3.1'
    implementation 'io.github.mkpaz:atlantafx-base:2.0.1'
    
    // Jackson for JSON
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.15.2'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.15.2'
    
    // WebSocket / Stomp Client
    implementation 'org.springframework:spring-messaging:6.1.4'
    implementation 'org.springframework:spring-websocket:6.1.4'
    implementation 'org.glassfish.tyrus.bundles:tyrus-standalone-client:2.1.1'
    // Jakarta WebSocket API (for ClientEndpointConfig)
    implementation 'jakarta.websocket:jakarta.websocket-client-api:2.1.1'
    
    // Logging
    implementation 'org.slf4j:slf4j-api:2.0.7'
    implementation 'ch.qos.logback:logback-classic:1.4.11'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation 'org.assertj:assertj-core:3.25.3'
}

test {
    useJUnitPlatform()
}

shadowJar {
    archiveBaseName = 'frontend'
    archiveVersion = project.version
    archiveClassifier = 'all'
    
    manifest {
        attributes(
            'Main-Class': 'com.example.frontend.DashboardApp',
            'Implementation-Title': project.name,
            'Implementation-Version': project.version
        )
    }
}

tasks.register('packageExe', Exec) {
    dependsOn shadowJar
    onlyIf { OperatingSystem.current().isWindows() }

    doFirst {
        def outputDir = file("$buildDir/package")
        delete(outputDir)
        outputDir.mkdirs()

        commandLine 'jpackage',
            '--type', 'app-image',
            '--name', 'ClassroomDashboard',
            '--input', file("$buildDir/libs").absolutePath,
            '--main-jar', shadowJar.archiveFileName.get(),
            '--main-class', application.mainClass.get(),
            '--dest', outputDir.absolutePath,
            '--vendor', 'GitHub Copilot',
            '--description', 'Integrated Classroom Dashboard'
    }
}

// Make shadowJar the default jar task
jar.dependsOn shadowJar
build.dependsOn shadowJar