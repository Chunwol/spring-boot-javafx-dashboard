spring:
  application:
    name: ${APP_NAME:Classroom Dashboard}
  profiles:
    active: ${APP_PROFILE:default}
  datasource:
    url: ${DB_URL:jdbc:sqlite:db/mydatabase.db}
    driver-class-name: ${DB_DRIVER:org.sqlite.JDBC}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate.dialect: org.hibernate.community.dialect.SQLiteDialect
    show-sql: ${JPA_SHOW_SQL:false}
  flyway:
    enabled: true
    validate-on-migrate: false
  mail:
    host: ${MAIL_HOST:smtp.example.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:your-email@example.com}
    password: ${MAIL_PASSWORD:your-email-password}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:20971520}
      max-request-size: ${MAX_FILE_SIZE:20971520}

server:
  port: ${SERVER_PORT:8888}
  servlet:
    context-path: /
  # Nginx 리버스 프록시의 X-Forwarded-Proto/For 헤더 신뢰
  forward-headers-strategy: NATIVE
  
scheduler:
  fixed-rate: 60000
  initial-delay: 5000

app:
  security:
    admin-users: ${ADMIN_USERS:${DEFAULT_ADMIN_USERNAME:admin}}
    viewer-users: ${VIEWER_USERS:${DEFAULT_VIEWER_USERNAME:}}
  scripts:
    dir: ${UPLOAD_DIR:uploads/}
  file-distribution:
    default-wave-size: ${FD_DEFAULT_WAVE_SIZE:20}
    max-wave-size: ${FD_MAX_WAVE_SIZE:100}
    fail-threshold: ${FD_FAIL_THRESHOLD:0.20}
    security:
      enabled: ${FD_SECURITY_ENABLED:false}
      shared-secret: ${FD_SHARED_SECRET:change-me-file-distribution-secret}
      max-skew-seconds: ${FD_SIGNATURE_MAX_SKEW_SECONDS:60}
      require-https: ${FD_REQUIRE_HTTPS:true}
  cache:
    ip-range:
      maximum-size: ${IP_RANGE_CACHE_MAX_SIZE:10000}
      expire-minutes: ${IP_RANGE_CACHE_EXPIRE_MINUTES:10}
  jwt:
    secret: ${JWT_SECRET:your-secret-key-change-me-in-production}
    expiration: ${JWT_EXPIRATION:86400000}
  heartbeat:
    timeout-minutes: ${HEARTBEAT_TIMEOUT_MINUTES:5}
    interval-seconds: ${HEARTBEAT_INTERVAL_SECONDS:120}
    persist-interval-seconds: ${HEARTBEAT_PERSIST_INTERVAL_SECONDS:30}
  command:
    timeout-seconds: ${COMMAND_TIMEOUT_SECONDS:45}
    verify-offline-timeout-seconds: ${COMMAND_VERIFY_OFFLINE_TIMEOUT_SECONDS:120}
    verify-offline-silence-seconds: ${COMMAND_VERIFY_OFFLINE_SILENCE_SECONDS:40}
    verify-online-timeout-seconds: ${COMMAND_VERIFY_ONLINE_TIMEOUT_SECONDS:240}
  traffic:
    alert-threshold-mbps: ${TRAFFIC_ALERT_THRESHOLD_MBPS:100}
    log-min-interval-seconds: ${TRAFFIC_LOG_MIN_INTERVAL_SECONDS:30}
  audit:
    flush-interval-ms: ${AUDIT_FLUSH_INTERVAL_MS:2000}
    flush-batch-size: ${AUDIT_FLUSH_BATCH_SIZE:200}
    queue-max-size: ${AUDIT_QUEUE_MAX_SIZE:20000}
  alert:
    email: ${ALERT_EMAIL:}
  ratelimit:
    requests-per-minute: ${RATELIMIT_REQUESTS_PER_MINUTE:600}
    requests-per-hour: ${RATELIMIT_REQUESTS_PER_HOUR:30000}
    concurrent-requests: ${RATELIMIT_CONCURRENT_REQUESTS:100}

agent:
  install-key: ${AGENT_INSTALL_KEY:INST-CHANGE-ME-BEFORE-DEPLOY}

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    com.example.backend: DEBUG

# Springdoc OpenAPI (Swagger) Configuration
springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
  api-docs:
    path: /v3/api-docs
  show-actuator: false
