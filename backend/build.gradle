plugins {
    id 'java'
    id 'org.springframework.boot' version '3.0.0'
    id 'io.spring.dependency-management' version '1.0.15.RELEASE'
    id 'io.freefair.lombok' version '8.6'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
    sourceCompatibility = '17'
}

repositories {
    mavenCentral()
}

compileJava {
    options.encoding = 'UTF-8'
}

dependencies {
    // Spring Boot Starters
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-mail'

    // Database (SQLite as requested, H2 compatible)
    implementation 'org.xerial:sqlite-jdbc:3.45.1.0'
    
    // JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'
    
    // Utilities
    // Lombok handled by plugin
    
    // PDF Reporting
    implementation 'com.itextpdf:itext7-core:7.2.5'
    
    // API Documentation (OpenAPI 3.0 Swagger)
    implementation 'io.swagger.core.v3:swagger-annotations:2.2.9'
    implementation 'io.swagger.core.v3:swagger-models:2.2.9'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.0.3'

    // JSON Parsing (if needed extra)
    implementation 'org.json:json:20231013'

    // Hibernate dialects for SQLite
    implementation 'org.hibernate:hibernate-community-dialects:6.2.4.Final'
    
    // Dotenv for .env file support
    implementation 'io.github.cdimascio:dotenv-java:3.0.0'

    // Database migrations
    implementation 'org.flywaydb:flyway-core'

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
}

tasks.named('test') {
    useJUnitPlatform()
}

springBoot {
    mainClass = 'com.example.backend.Application'
}