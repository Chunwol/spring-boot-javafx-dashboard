plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.5'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'io.freefair.lombok' version '9.2.0'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

lombok {
    version = '1.18.38'
}

repositories {
    mavenCentral()
}

def webFrontendDir = file('../web-frontend')
def webFrontendDist = file('../web-frontend/dist')
def generatedWebResources = layout.buildDirectory.dir('generated-resources/web')
def skipWebFrontendBuild = providers.gradleProperty('skipWebFrontendBuild').map { it.toBoolean() }.orElse(false)
def npmExecutable = System.getProperty('os.name').toLowerCase().contains('windows') ? 'npm.cmd' : 'npm'

tasks.register('installWebFrontend', Exec) {
    description = 'Installs the locked web frontend dependencies.'
    workingDir webFrontendDir
    commandLine npmExecutable, 'ci'
    inputs.files file('../web-frontend/package.json'), file('../web-frontend/package-lock.json')
    outputs.file file('../web-frontend/node_modules/.package-lock.json')
    onlyIf { !skipWebFrontendBuild.get() }
}

tasks.register('buildWebFrontend', Exec) {
    description = 'Builds the production web frontend for the Spring Boot JAR.'
    dependsOn tasks.named('installWebFrontend')
    workingDir webFrontendDir
    commandLine npmExecutable, 'run', 'build'
    inputs.files fileTree('../web-frontend/src'), file('../web-frontend/index.html'),
            file('../web-frontend/vite.config.ts'), file('../web-frontend/tsconfig.json')
    outputs.dir webFrontendDist
    onlyIf { !skipWebFrontendBuild.get() }
}

tasks.register('syncWebFrontend', Sync) {
    description = 'Copies the production web frontend into Spring Boot static resources.'
    dependsOn tasks.named('buildWebFrontend')
    from(webFrontendDist) {
        into 'static'
    }
    into generatedWebResources
    doFirst {
        if (!webFrontendDist.isDirectory() || !new File(webFrontendDist, 'index.html').isFile()) {
            throw new GradleException('web-frontend/dist is missing. Build the frontend or remove -PskipWebFrontendBuild.')
        }
    }
}

sourceSets.main.resources.srcDir(generatedWebResources)
tasks.named('processResources') {
    dependsOn tasks.named('syncWebFrontend')
}

compileJava {
    options.encoding = 'UTF-8'
}

dependencies {
    // Common module (shared DTOs)
    implementation(project(':common')) {
        exclude group: 'io.swagger.core.v3', module: 'swagger-annotations'
    }

    // Spring Boot Starters
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'com.github.ben-manes.caffeine:caffeine'

    // Database
    runtimeOnly 'org.postgresql:postgresql'
    // SQLite fallback/test compatibility
    implementation 'org.xerial:sqlite-jdbc:3.45.1.0'
    
    // JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'
    
    // Utilities
    // Lombok handled by plugin
    
    // PDF Reporting
    implementation 'com.itextpdf:itext7-core:7.2.5'
    
    // API Documentation (OpenAPI 3.0 Swagger)
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'

    // Hibernate dialects for SQLite
    implementation 'org.hibernate.orm:hibernate-community-dialects'
    
    // Dotenv for .env file support
    implementation 'io.github.cdimascio:dotenv-java:3.0.0'
    implementation 'io.micrometer:micrometer-core'
    implementation 'io.micrometer:micrometer-registry-prometheus'

    // Database migrations
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-database-postgresql'

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'

    // ByteBuddy upgrade for Java 25 class file version support
    testImplementation 'net.bytebuddy:byte-buddy:1.17.5'
    testImplementation 'net.bytebuddy:byte-buddy-agent:1.17.5'

    // PDF → PNG 렌더링 (보고서 육안 검증 테스트 전용)
    testImplementation 'org.apache.pdfbox:pdfbox:3.0.3'
}

tasks.named('test') {
    useJUnitPlatform()
    // Java 25: byte-buddy-agent must be loaded via -javaagent (dynamic agent loading disallowed)
    jvmArgs '-XX:+EnableDynamicAgentLoading'
    exclude '**/*IntegrationTest.class'
}

tasks.register('unitTest', Test) {
    description = 'Runs backend unit tests (excluding integration tests).'
    group = 'verification'
    useJUnitPlatform()
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    jvmArgs '-XX:+EnableDynamicAgentLoading'
    exclude '**/*IntegrationTest.class'
}

tasks.register('integrationTest', Test) {
    description = 'Runs backend integration/smoke tests.'
    group = 'verification'
    useJUnitPlatform()
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    jvmArgs '-XX:+EnableDynamicAgentLoading'
    include '**/*IntegrationTest.class'
    shouldRunAfter tasks.named('unitTest')
}

springBoot {
    mainClass = 'com.example.backend.Application'
}
