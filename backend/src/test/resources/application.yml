spring:
  datasource:
    url: jdbc:sqlite:file:backend-test?mode=memory&cache=shared
    driver-class-name: org.sqlite.JDBC
  mail:
    host: localhost
    port: 2525
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate.dialect: org.hibernate.community.dialect.SQLiteDialect
    show-sql: false
  flyway:
    enabled: true
    clean-disabled: false
    locations: classpath:db/migration

logging:
  level:
    root: WARN
    com.example.backend: INFO
