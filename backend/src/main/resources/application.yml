spring:
  application:
    name: ${APP_NAME:Classroom Dashboard}
  profiles:
    active: ${APP_PROFILE:default}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dashboard_db}
    driver-class-name: ${DB_DRIVER:org.postgresql.Driver}
    username: ${DB_USERNAME:${POSTGRES_USER:dashboard}}
    password: ${DB_PASSWORD:${POSTGRES_PASSWORD:dashboard}}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:70}   # 800대: 80 long-pollers + writes + scheduler
      minimum-idle: ${DB_POOL_MIN_IDLE:15}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:30000}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME_MS:1800000}
      validation-timeout: ${DB_POOL_VALIDATION_TIMEOUT_MS:5000}
      # PgBouncer transaction-mode 호환 설정:
      # Hibernate의 서버사이드 prepared statement는 특정 PG 백엔드 프로세스에 바인딩되므로
      # transaction-mode에서는 커넥션이 바뀔 때마다 "prepared statement not found" 오류 발생.
      # prepareThreshold=0 으로 JDBC 드라이버가 항상 simple query protocol을 사용하도록 강제.
      data-source-properties:
        prepareThreshold: ${DB_PREPARE_THRESHOLD:0}
  jpa:
    open-in-view: ${JPA_OPEN_IN_VIEW:${SPRING_JPA_OPEN_IN_VIEW:false}}
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    properties:
      hibernate.dialect: ${JPA_HIBERNATE_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
      hibernate.jdbc.time_zone: ${APP_HIBERNATE_JDBC_TIME_ZONE:${APP_TIME_ZONE:Asia/Seoul}}
      hibernate.jdbc.batch_size: ${JPA_BATCH_SIZE:50}
      hibernate.order_inserts: true
      hibernate.order_updates: true
    show-sql: ${JPA_SHOW_SQL:false}
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: ${FLYWAY_LOCATIONS:classpath:db/pgmigration}
    validate-on-migrate: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT_MS:5000ms}
  cache:
    type: ${SPRING_CACHE_TYPE:redis}
  mail:
    host: ${MAIL_HOST:smtp.example.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:your-email@example.com}
    password: ${MAIL_PASSWORD:your-email-password}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:209715200}       # 기본 200MB (환경변수로 조정 가능)
      max-request-size: ${MAX_REQUEST_SIZE:209715200}  # 기본 200MB (파일+메타데이터)

server:
  address: ${SERVER_HOST:0.0.0.0}
  port: ${SERVER_PORT:8888}
  servlet:
    context-path: /
  tomcat:
    threads:
      max: ${SERVER_TOMCAT_MAX_THREADS:400}
      min-spare: ${SERVER_TOMCAT_MIN_SPARE_THREADS:50}
    max-connections: ${SERVER_TOMCAT_MAX_CONNECTIONS:8192}
    accept-count: ${SERVER_TOMCAT_ACCEPT_COUNT:200}
  # Nginx 리버스 프록시의 X-Forwarded-Proto/For 헤더 신뢰
  forward-headers-strategy: NATIVE
  
scheduler:
  fixed-rate: 60000
  initial-delay: 5000

app:
  scmate:
    cli-username: ${SCMATE_CLI_USERNAME:}
    cli-password: ${SCMATE_CLI_PASSWORD:}
  runtime:
    async:
      core-pool-size: ${APP_ASYNC_CORE_POOL_SIZE:12}
      max-pool-size: ${APP_ASYNC_MAX_POOL_SIZE:64}
      queue-capacity: ${APP_ASYNC_QUEUE_CAPACITY:4000}
      await-termination-seconds: ${APP_ASYNC_AWAIT_TERMINATION_SECONDS:30}
    scheduler:
      pool-size: ${APP_SCHEDULER_POOL_SIZE:4}
      await-termination-seconds: ${APP_SCHEDULER_AWAIT_TERMINATION_SECONDS:30}
    websocket:
      inbound-core-pool-size: ${APP_WS_INBOUND_CORE_POOL_SIZE:8}
      inbound-max-pool-size: ${APP_WS_INBOUND_MAX_POOL_SIZE:32}
      inbound-queue-capacity: ${APP_WS_INBOUND_QUEUE_CAPACITY:4000}
      outbound-core-pool-size: ${APP_WS_OUTBOUND_CORE_POOL_SIZE:8}
      outbound-max-pool-size: ${APP_WS_OUTBOUND_MAX_POOL_SIZE:32}
      outbound-queue-capacity: ${APP_WS_OUTBOUND_QUEUE_CAPACITY:4000}
      message-size-limit-bytes: ${APP_WS_MESSAGE_SIZE_LIMIT_BYTES:1048576}
      send-buffer-size-limit-bytes: ${APP_WS_SEND_BUFFER_SIZE_LIMIT_BYTES:2097152}
      send-time-limit-ms: ${APP_WS_SEND_TIME_LIMIT_MS:20000}
  security:
    admin-users: ${ADMIN_USERS:${DEFAULT_ADMIN_USERNAME:admin}}
    viewer-users: ${VIEWER_USERS:${DEFAULT_VIEWER_USERNAME:}}
    cors:
      # Comma-separated exact origins. Same-origin production requests do not require CORS.
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  nginx:
    # true: Nginx X-Accel-Redirect로 파일 서빙 위임 (JVM 힙 우회, Tomcat 스레드 즉시 반환)
    # Nginx에 아래 설정이 필요함:
    #   location /internal-uploads/ { internal; alias /app/uploads/; }
    # NAS Nginx: alias를 실제 uploads 경로로 변경할 것
    accel-redirect-enabled: ${NGINX_ACCEL_REDIRECT:false}
    internal-location: ${NGINX_INTERNAL_LOCATION:/internal-uploads/}
  scripts:
    dir: ${UPLOAD_DIR:uploads/}
    chunk-max-bytes: ${SCRIPT_CHUNK_MAX_BYTES:16777216}
    chunk-staging-max-bytes: ${SCRIPT_CHUNK_STAGING_MAX_BYTES:64424509440}
    chunk-ttl-ms: ${SCRIPT_CHUNK_TTL_MS:86400000}
    chunk-cleanup-interval-ms: ${SCRIPT_CHUNK_CLEANUP_INTERVAL_MS:3600000}
  collect:
    max-total-bytes: ${COLLECT_ARTIFACT_MAX_TOTAL_BYTES:32212254720}
  http-redirect:
    enabled: ${APP_HTTP_REDIRECT_ENABLED:true}
    port: ${APP_HTTP_REDIRECT_PORT:8888}
  file-distribution:
    default-wave-size: ${FD_DEFAULT_WAVE_SIZE:5}
    max-wave-size: ${FD_MAX_WAVE_SIZE:40}
    default-ramp-up-factor: ${FD_DEFAULT_RAMP_UP_FACTOR:1.4}
    peer-port: ${FD_PEER_PORT:18777}
    max-peer-candidates: ${FD_MAX_PEER_CANDIDATES:60}
    peer-shared-secret: ${FD_PEER_SHARED_SECRET:change-me-peer-shared-secret}
    fail-threshold: ${FD_FAIL_THRESHOLD:0.20}
    auto-rollback-enabled: ${FD_AUTO_ROLLBACK_ENABLED:true}
    auto-catchup-on-heartbeat: ${FD_AUTO_CATCHUP_ON_HEARTBEAT:false}
    auto-catchup-failure-cooldown-seconds: ${FD_AUTO_CATCHUP_FAILURE_COOLDOWN_SECONDS:300}
    security:
      enabled: ${FD_SECURITY_ENABLED:false}
      shared-secret: ${FD_SHARED_SECRET:change-me-file-distribution-secret}
      max-skew-seconds: ${FD_SIGNATURE_MAX_SKEW_SECONDS:60}
      require-https: ${FD_REQUIRE_HTTPS:true}
  cache:
    provider: ${CACHE_PROVIDER:redis}
    ip-range:
      maximum-size: ${IP_RANGE_CACHE_MAX_SIZE:10000}
      expire-minutes: ${IP_RANGE_CACHE_EXPIRE_MINUTES:10}
  agent:
    token-cache-ttl-seconds: ${AGENT_TOKEN_CACHE_TTL_SECONDS:300}
  jwt:
    secret: ${JWT_SECRET:your-secret-key-change-me-in-production}
    expiration: ${JWT_EXPIRATION:86400000}
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:7776000000}
    refresh-cookie-secure: ${JWT_REFRESH_COOKIE_SECURE:false}
  heartbeat:
    timeout-minutes: ${HEARTBEAT_TIMEOUT_MINUTES:2}
    interval-seconds: ${HEARTBEAT_INTERVAL_SECONDS:120}
    offline-scan-fixed-rate-ms: ${HEARTBEAT_OFFLINE_SCAN_FIXED_RATE_MS:60000}
    offline-scan-initial-delay-ms: ${HEARTBEAT_OFFLINE_SCAN_INITIAL_DELAY_MS:30000}
    persist-interval-seconds: ${HEARTBEAT_PERSIST_INTERVAL_SECONDS:30}
    auto-catchup-check-interval-seconds: ${HEARTBEAT_AUTO_CATCHUP_CHECK_INTERVAL_SECONDS:300}
  command:
    timeout-seconds: ${COMMAND_TIMEOUT_SECONDS:600}
    queue-ttl-seconds: ${COMMAND_QUEUE_TTL_SECONDS:300}
    dispatch-on-heartbeat: ${COMMAND_DISPATCH_ON_HEARTBEAT:true}
    verify-offline-timeout-seconds: ${COMMAND_VERIFY_OFFLINE_TIMEOUT_SECONDS:120}
    verify-offline-silence-seconds: ${COMMAND_VERIFY_OFFLINE_SILENCE_SECONDS:40}
    verify-online-timeout-seconds: ${COMMAND_VERIFY_ONLINE_TIMEOUT_SECONDS:240}
  wol:
    router:
      enabled: ${ROUTER_WOL_ENABLED:false}
      username: ${ROUTER_WOL_USERNAME:}
      password: ${ROUTER_WOL_PASSWORD:}
      connect-timeout: ${ROUTER_WOL_CONNECT_TIMEOUT:2s}
      request-timeout: ${ROUTER_WOL_REQUEST_TIMEOUT:4s}
      dedup-window: ${ROUTER_WOL_DEDUP_WINDOW:2m}
      routes:
        - cidr: 223.194.166.0/24
          gateways:
            - ${ROUTER_WOL_166_PRIMARY_URL:http://223.194.166.249:8080}
            - ${ROUTER_WOL_166_SECONDARY_URL:http://223.194.166.245:8080}
        - cidr: 223.194.167.0/24
          gateways:
            - ${ROUTER_WOL_167_PRIMARY_URL:http://223.194.167.253:8080}
            - ${ROUTER_WOL_167_SECONDARY_URL:http://223.194.167.252:8080}
        - cidr: 223.194.168.0/24
          gateways:
            - ${ROUTER_WOL_168_PRIMARY_URL:http://223.194.168.251:8080}
            - ${ROUTER_WOL_168_SECONDARY_URL:}
        - cidr: 223.194.169.0/24
          gateways:
            - ${ROUTER_WOL_169_PRIMARY_URL:http://223.194.169.250:8080}
            - ${ROUTER_WOL_169_SECONDARY_URL:}
        - cidr: 172.16.204.0/24
          gateways:
            - ${ROUTER_WOL_204_PRIMARY_URL:http://172.16.204.150:8080}
            - ${ROUTER_WOL_204_SECONDARY_URL:http://172.16.204.151:8080}
        - cidr: 172.16.13.0/24
          gateways:
            - ${ROUTER_WOL_6_PRIMARY_URL:}
            - ${ROUTER_WOL_6_SECONDARY_URL:}
  traffic:
    alert-threshold-mbps: ${TRAFFIC_ALERT_THRESHOLD_MBPS:100}
    log-min-interval-seconds: ${TRAFFIC_LOG_MIN_INTERVAL_SECONDS:30}
    flush-interval-ms: ${TRAFFIC_FLUSH_INTERVAL_MS:5000}       # TrafficLogFlushService 배치 주기
    flush-initial-delay-ms: ${TRAFFIC_FLUSH_INITIAL_DELAY_MS:10000}
  dashboard:
    traffic-lookback-seconds: ${DASHBOARD_TRAFFIC_LOOKBACK_SECONDS:0}
  audit:
    flush-interval-ms: ${AUDIT_FLUSH_INTERVAL_MS:2000}
    flush-batch-size: ${AUDIT_FLUSH_BATCH_SIZE:200}
    queue-max-size: ${AUDIT_QUEUE_MAX_SIZE:20000}
  alert:
    email: ${ALERT_EMAIL:}
  ratelimit:
    requests-per-minute: ${RATELIMIT_REQUESTS_PER_MINUTE:600}
    requests-per-hour: ${RATELIMIT_REQUESTS_PER_HOUR:30000}
    concurrent-requests: ${RATELIMIT_CONCURRENT_REQUESTS:100}
  backup:
    enabled: ${DB_BACKUP_ENABLED:true}
    cron: ${DB_BACKUP_CRON:0 0 1 * * *}
    zone: ${DB_BACKUP_ZONE:Asia/Seoul}
    dir: ${DB_BACKUP_DIR:./backups/postgres}
    keep-days: ${DB_BACKUP_KEEP_DAYS:14}
    pg-dump-path: ${PG_DUMP_PATH:pg_dump}
    timeout-minutes: ${DB_BACKUP_TIMEOUT_MINUTES:30}
    lock-key: ${DB_BACKUP_LOCK_KEY:94503177}
  metrics:
    alert:
      command-failure-rate: ${METRICS_ALERT_COMMAND_FAILURE_RATE:0.25}
      transfer-failure-rate: ${METRICS_ALERT_TRANSFER_FAILURE_RATE:0.25}
      request-error-rate: ${METRICS_ALERT_REQUEST_ERROR_RATE:0.15}
      forbidden-rate: ${METRICS_ALERT_FORBIDDEN_RATE:0.40}
      ack-p95-ms: ${METRICS_ALERT_ACK_P95_MS:20000}
      result-p95-ms: ${METRICS_ALERT_RESULT_P95_MS:45000}
      window-seconds: ${METRICS_ALERT_WINDOW_SECONDS:300}
      min-command-samples: ${METRICS_ALERT_MIN_COMMAND_SAMPLES:10}
      min-transfer-samples: ${METRICS_ALERT_MIN_TRANSFER_SAMPLES:10}
      min-request-samples: ${METRICS_ALERT_MIN_REQUEST_SAMPLES:20}

agent:
  install-key: ${AGENT_INSTALL_KEY:INST-CHANGE-ME-BEFORE-DEPLOY}

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    com.example.backend: DEBUG

# Springdoc OpenAPI (Swagger) Configuration
springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
  api-docs:
    path: /v3/api-docs
  show-actuator: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
    prometheus:
      enabled: true
  health:
    db:
      enabled: true
    redis:
      enabled: true
  metrics:
    tags:
      application: ${APP_NAME:Classroom Dashboard}
