name: deploy-production

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "common/**"
      - "web-frontend/**"
      - "build.gradle*"
      - "settings.gradle*"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "deploy/Dockerfile.jar-overlay"
      - "deploy/scripts/deploy-jar-overlay.sh"
      - ".github/workflows/deploy-production.yml"
  workflow_dispatch:

concurrency:
  group: production-dashboard
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web-frontend/package-lock.json

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"

      - name: Install deployment tools
        run: |
          sudo apt-get update
          sudo apt-get install -y openvpn sshpass

      - name: Build backend with embedded web frontend
        run: |
          gradle :backend:clean :backend:bootJar -x test --no-daemon

      - name: Connect to school OpenVPN
        env:
          OPENVPN_CONFIG_BASE64: ${{ secrets.OPENVPN_CONFIG_BASE64 }}
          OPENVPN_USERNAME: ${{ secrets.OPENVPN_USERNAME }}
          OPENVPN_PASSWORD: ${{ secrets.OPENVPN_PASSWORD }}
        run: |
          printf '%s' "$OPENVPN_CONFIG_BASE64" | base64 --decode > /tmp/classroom.ovpn
          printf '%s\n%s\n' "$OPENVPN_USERNAME" "$OPENVPN_PASSWORD" > /tmp/classroom.auth
          chmod 600 /tmp/classroom.ovpn /tmp/classroom.auth
          sudo openvpn --config /tmp/classroom.ovpn \
            --auth-user-pass /tmp/classroom.auth \
            --daemon --writepid /tmp/classroom-openvpn.pid \
            --log /tmp/classroom-openvpn.log
          for attempt in $(seq 1 30); do
            if sudo grep -q 'Initialization Sequence Completed' /tmp/classroom-openvpn.log; then
              exit 0
            fi
            sleep 2
          done
          sudo sed -E 's/(AUTH|password|username).*/[redacted]/Ig' /tmp/classroom-openvpn.log >&2
          exit 1

      - name: Verify NAS host key
        env:
          NAS_HOST: ${{ secrets.NAS_SSH_HOST }}
          NAS_HOST_FINGERPRINT: ${{ secrets.NAS_SSH_HOST_FINGERPRINT }}
        run: |
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          ssh-keyscan -T 15 -t ed25519 "$NAS_HOST" > "$HOME/.ssh/known_hosts.candidate"
          actual=$(ssh-keygen -lf "$HOME/.ssh/known_hosts.candidate" -E sha256 | awk 'NR == 1 { print $2 }')
          test "$actual" = "$NAS_HOST_FINGERPRINT"
          mv "$HOME/.ssh/known_hosts.candidate" "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Upload and deploy application
        env:
          NAS_HOST: ${{ secrets.NAS_SSH_HOST }}
          NAS_USER: ${{ secrets.NAS_SSH_USER }}
          SSHPASS: ${{ secrets.NAS_SSH_PASSWORD }}
        run: |
          sha=$(sha256sum backend/build/libs/backend-0.0.1-SNAPSHOT.jar | awk '{print $1}')
          sshpass -e scp -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            backend/build/libs/backend-0.0.1-SNAPSHOT.jar \
            "$NAS_USER@$NAS_HOST:/tmp/classroom-dashboard-app.jar"
          sshpass -e scp -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            deploy/scripts/deploy-jar-overlay.sh \
            "$NAS_USER@$NAS_HOST:/tmp/deploy-jar-overlay.sh"
          printf '%s\n' "$SSHPASS" | sshpass -e ssh \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$NAS_USER@$NAS_HOST" \
            "sudo -S sh /tmp/deploy-jar-overlay.sh '$sha'"

      - name: Deployment summary
        if: success()
        run: |
          {
            echo "### Production deployment complete"
            echo "- Backend and embedded web frontend deployed together"
            echo "- Agent was not updated"
            echo "- PostgreSQL and Redis were preserved"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Disconnect OpenVPN
        if: always()
        run: |
          if [ -f /tmp/classroom-openvpn.pid ]; then
            sudo kill "$(sudo cat /tmp/classroom-openvpn.pid)" 2>/dev/null || true
          fi
          rm -f /tmp/classroom.auth /tmp/classroom.ovpn
