name: deploy-production

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "common/**"
      - "web-frontend/**"
      - "build.gradle*"
      - "settings.gradle*"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "deploy/Dockerfile.jar-overlay"
      - "deploy/scripts/deploy-jar-overlay.sh"
      - ".github/workflows/deploy-production.yml"
  workflow_dispatch:

concurrency:
  group: production-dashboard
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web-frontend/package-lock.json

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"

      - name: Build backend with embedded web frontend
        run: gradle :backend:clean :backend:bootJar -x test --no-daemon

      - name: Package deployment artifact
        run: |
          mkdir -p deployment-artifact
          cp backend/build/libs/backend-0.0.1-SNAPSHOT.jar deployment-artifact/app.jar
          cp deploy/scripts/deploy-jar-overlay.sh deployment-artifact/deploy.sh
          sha256sum deployment-artifact/app.jar | awk '{print $1}' > deployment-artifact/app.jar.sha256

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-dashboard-${{ github.sha }}
          path: deployment-artifact
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: build
    runs-on: [self-hosted, linux, x64, classroom-nas]
    timeout-minutes: 10
    environment: production

    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: production-dashboard-${{ github.sha }}
          path: deployment-artifact

      - name: Deploy application locally on NAS
        run: |
          sha=$(cat deployment-artifact/app.jar.sha256)
          cp deployment-artifact/app.jar /tmp/classroom-dashboard-app.jar
          sh deployment-artifact/deploy.sh "$sha"

      - name: Deployment summary
        if: success()
        run: |
          {
            echo "### Production deployment complete"
            echo "- Backend and embedded web frontend deployed together"
            echo "- Agent was not updated"
            echo "- PostgreSQL and Redis were preserved"
          } >> "$GITHUB_STEP_SUMMARY"
