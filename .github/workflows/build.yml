name: build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile Modules
        run: |
          chmod +x ./gradlew
          ./gradlew :common:compileJava :backend:bootJar :agent:compileJava -x test --no-daemon

      - name: Repro Guide
        if: failure()
        run: |
          {
            echo "### 재현 가이드"
            echo "- docs/CI_REPRO_GUIDE.md 참고"
          } >> "$GITHUB_STEP_SUMMARY"
