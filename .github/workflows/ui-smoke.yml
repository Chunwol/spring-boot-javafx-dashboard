name: ui-smoke

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  frontend-ui-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run JavaFX UI Smoke Tests (TestFX)
        run: |
          chmod +x ./gradlew
          xvfb-run -a ./gradlew :frontend:uiSmokeTest --no-daemon

      - name: Upload UI Smoke Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-ui-smoke-results
          path: |
            frontend/build/test-results/uiSmokeTest/**
            frontend/build/reports/tests/uiSmokeTest/**
            frontend/build/test-results/test/**
            frontend/build/reports/tests/test/**
          if-no-files-found: warn

      - name: Repro Guide
        if: failure()
        run: |
          {
            echo "### 재현 가이드"
            echo "- docs/CI_REPRO_GUIDE.md#4-javafx-ui-스모크-파이프라인-ui-smoke"
          } >> "$GITHUB_STEP_SUMMARY"
