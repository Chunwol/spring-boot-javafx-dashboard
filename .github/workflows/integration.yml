name: integration

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  backend-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"

      - name: Run Backend Integration/API Smoke
        run: |
          gradle :backend:integrationTest --no-daemon

      - name: Upload Integration Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-integration-results
          path: |
            backend/build/test-results/integrationTest/**
            backend/build/reports/tests/integrationTest/**
            backend/build/test-results/test/**
            backend/build/reports/tests/test/**
          if-no-files-found: warn

      - name: Repro Guide
        if: failure()
        run: |
          {
            echo "### 재현 가이드"
            echo "- docs/CI_REPRO_GUIDE.md#3-통합api-스모크-파이프라인-integration"
          } >> "$GITHUB_STEP_SUMMARY"
