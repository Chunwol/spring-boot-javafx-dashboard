name: unit

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Unit Tests
        run: |
          chmod +x ./gradlew
          ./gradlew :common:test :agent:test :backend:unitTest -PskipWebFrontendBuild=true --no-daemon

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: |
            common/build/test-results/**
            common/build/reports/tests/**
            agent/build/test-results/**
            agent/build/reports/tests/**
            backend/build/test-results/**
            backend/build/reports/tests/**
          if-no-files-found: warn

      - name: Repro Guide
        if: failure()
        run: |
          {
            echo "### 재현 가이드"
            echo "- docs/CI_REPRO_GUIDE.md#2-단위-테스트-파이프라인-unit"
          } >> "$GITHUB_STEP_SUMMARY"
